name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Build EXE files
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name single single.py
          pyinstaller --noconfirm --clean --onefile --name multi multi.py
          pyinstaller --noconfirm --clean --onefile --name server server.py

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/main.exe,dist/tool1.exe,dist/tool2.exe `
            -DestinationPath "MyPythonProject-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "Tic-Tac-Toe-${{ github.ref_name }}.zip" `
            --title "${{ github.ref_name }}" `
            --generate-notes
